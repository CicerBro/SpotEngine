name: spotengine

services:
    app:
        build:
            context: .
            dockerfile: docker/frankenphp/Dockerfile
        restart: unless-stopped
        env_file:
            - .env
        environment:
            SERVER_NAME: ${SERVER_NAME:-:80}
            DB_HOST: db
            DB_PORT: 5432
            REDIS_HOST: valkey
            REDIS_PORT: 6379
        ports:
            - "${APP_PORT:-8000}:80"
        volumes:
            - .:/app
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            db:
                condition: service_healthy

    db:
        image: postgres:18
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-spotengine}
            POSTGRES_USER: ${DB_USERNAME:-spotengine}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-spotengine}
        ports:
            - "${FORWARD_DB_PORT:-5432}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USERNAME:-spotengine} -d ${DB_DATABASE:-spotengine}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s

    valkey:
        image: valkey/valkey:alpine
        restart: unless-stopped
        command:
            - redis-server
            - --appendonly
            - "yes"
            - --save
            - "60"
            - "1000"
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - valkey_data:/data
        healthcheck:
            test: ["CMD", "valkey-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s

    vite:
        image: oven/bun:1
        working_dir: /app
        command: sh -lc "bun install && bun run dev --host 0.0.0.0 --port 5173"
        ports:
            - "${VITE_PORT:-5173}:5173"
        volumes:
            - .:/app
            - bun_node_modules:/app/node_modules
        profiles:
            - vite

volumes:
    caddy_data:
    caddy_config:
    postgres_data:
    valkey_data:
    bun_node_modules:
