services:
    app:
        build:
            context: .
            dockerfile: docker/frankenphp/Dockerfile.prod
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
        volumes: !override
            - caddy_data:/data
            - caddy_config:/config
            # NZB and image cache bind-mounted outside the image for persistence across rebuilds
            - ./storage/app/cache/nzb:/app/storage/app/cache/nzb
            - ./storage/app/cache/images:/app/storage/app/cache/images
