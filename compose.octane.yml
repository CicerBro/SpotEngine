services:
    app:
        command: >
            php artisan octane:start
            --server=frankenphp
            --host=0.0.0.0
            --port=80
            --admin-port=2019
            --max-requests=5000
        environment:
            APP_RUNTIME: Laravel\Octane\FrankenPhp\Runtime
            OCTANE_SERVER: frankenphp
